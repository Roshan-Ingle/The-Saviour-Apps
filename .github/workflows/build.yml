name: Build The Saviour APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  build-apk:
    name: Assemble Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build Debug APK
        run: |
          if [ -f "TheSaviour/settings.gradle.kts" ]; then
            cd TheSaviour
          fi
          gradle assembleDebug --stacktrace

      - name: Publish Direct APK to Repo Releases Folder
        run: |
          mkdir -p dist-apk
          APK_FILE=$(find . -name "app-debug.apk" | head -n 1)
          if [ -n "$APK_FILE" ]; then
            cp "$APK_FILE" dist-apk/The-Saviour-debug.apk
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add -f dist-apk/The-Saviour-debug.apk
            git commit -m "chore: publish built APK [skip ci]" || true
            git push || true
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: The-Saviour-APK
          path: "**/app/build/outputs/apk/debug/app-debug.apk"
